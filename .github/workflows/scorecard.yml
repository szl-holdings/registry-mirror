name: Scorecard

# Org reusable OpenSSF Scorecard gate (SHA-pinned caller). Wave H: estate-wide rollout, 2026-10-01.
# branch_protection_rule trigger intentionally omitted (see reusable note in szl-holdings/.github).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    # No `secrets: inherit`: the reusable workflow at this SHA declares and reads no secrets,
    # and this repository's only secrets are the Docker Hub pair the mirror job uses.
    uses: szl-holdings/.github/.github/workflows/reusable-scorecard.yml@8dfc69d1de7ec825294e5b5407cf96097106de4e
