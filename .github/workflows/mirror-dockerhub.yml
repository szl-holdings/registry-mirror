name: Mirror GHCR images to Docker Hub

# GHCR (ghcr.io/szl-holdings/*) stays the canonical, provenance-attested registry.
# This job mirrors selected tags of selected images to docker.io/szlholdings/* by
# digest-preserving copy (crane), so the Docker Hub tag is byte-identical to GHCR.
#
# Fail-closed / honest:
#   * If DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not installed as repository secrets the
#     job prints SETUP_REQUIRED and exits 0 (least privilege: the Docker Hub token is visible only to this one-purpose repository) — nothing is mirrored and nothing is claimed.
#   * Every copy is verified by comparing source and destination digests; a mismatch
#     fails the run. A receipt artifact lists image, tag, digests and result.
#   * Only `latest` and release-looking tags (x.y.z, vx.y.z, uds-vx.y.z) are mirrored.
#     Per-commit `sha-*` tags are not.
#   * Codename images are excluded by doctrine (no user-visible codename on a public surface).

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  SOURCE_ORG: ghcr.io/szl-holdings
  DEST_ORG: docker.io/szlholdings
  IMAGES: a11oy a11oy-bundle hatun-mcp killinchu killinchu-bundle szl-mesh szl-receipts szl-receipts-server szl-uds-bundle

jobs:
  mirror:
    name: digest-preserving mirror
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden runner
        id: harden
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check Docker Hub credentials are installed
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::SETUP_REQUIRED — repository secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not installed (gh secret set ... --repo szl-holdings/registry-mirror). Nothing mirrored."
            echo "state=SETUP_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "state=READY" >> "$GITHUB_OUTPUT"
          fi

      - name: Install crane (pinned release, checksum verified)
        id: install
        if: steps.creds.outputs.state == 'READY'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tgz
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar xzf crane.tgz crane
          ./crane version

      - name: Authenticate (GHCR read, Docker Hub write)
        id: auth
        if: steps.creds.outputs.state == 'READY'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ./crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | ./crane auth login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Mirror release tags and verify digests
        id: mirror
        if: steps.creds.outputs.state == 'READY'
        run: |
          set -euo pipefail
          : > receipt.jsonl
          fail=0
          crane_error="$(mktemp)"
          trap 'rm -f "$crane_error"' EXIT
          registry_access_blocked() {
            # Stop across the whole registry on definitive authorization or rate-limit
            # failures. Retrying every remaining tag can turn a 401 into a lockout.
            grep -Eiq 'unexpected status code (401|403|429)([^0-9]|$)|(^|[^[:alnum:]_])(UNAUTHORIZED|DENIED|TOOMANYREQUESTS)([^[:alnum:]_]|$)|incorrect username or password|too many failed login attempts' "$crane_error"
          }
          for img in $IMAGES; do
            # A failed listing is not proof that a source has no release tags.
            # Discard even partial stdout until the complete listing succeeds.
            if ! all_tags="$(./crane ls "$SOURCE_ORG/$img" 2>"$crane_error")"; then
              cat "$crane_error" >&2
              fail=1
              jq -cn --arg i "$img" '{image:$i, result:"SOURCE_TAG_LIST_FAILED"}' >> receipt.jsonl
              if registry_access_blocked; then break; fi
              continue
            fi
            tags="$(printf '%s\n' "$all_tags" | grep -E '^(latest|v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|uds-v[0-9]+\.[0-9]+\.[0-9]+)$' || true)"
            if [ -z "$tags" ]; then
              jq -cn --arg i "$img" '{image:$i, result:"NO_RELEASE_TAGS"}' >> receipt.jsonl; continue
            fi
            for t in $tags; do
              src="$SOURCE_ORG/$img:$t"; dst="$DEST_ORG/$img:$t"
              if ! sdig="$(./crane digest "$src" 2>"$crane_error")"; then
                cat "$crane_error" >&2
                fail=1
                jq -cn --arg i "$img" --arg t "$t" '{image:$i, tag:$t, result:"SOURCE_DIGEST_FAILED"}' >> receipt.jsonl
                if registry_access_blocked; then break 2; fi
                continue
              fi
              if ! ddig="$(./crane digest "$dst" 2>"$crane_error")"; then
                if registry_access_blocked; then
                  cat "$crane_error" >&2
                  fail=1
                  jq -cn --arg i "$img" --arg t "$t" '{image:$i, tag:$t, result:"DESTINATION_ACCESS_BLOCKED"}' >> receipt.jsonl
                  break 2
                fi
                # A destination tag that does not exist yet still needs its first copy.
                ddig=""
              fi
              if [ "$sdig" = "$ddig" ]; then
                jq -cn --arg i "$img" --arg t "$t" --arg d "$sdig" '{image:$i, tag:$t, digest:$d, result:"ALREADY_IDENTICAL"}' >> receipt.jsonl; continue
              fi
              # Copy the digest just inspected: a mutable source tag can move
              # between digest lookup and copy while another release publishes.
              if ./crane copy "$SOURCE_ORG/$img@$sdig" "$dst" 2>"$crane_error"; then
                if ! ndig="$(./crane digest "$dst" 2>"$crane_error")"; then
                  cat "$crane_error" >&2
                  fail=1
                  jq -cn --arg i "$img" --arg t "$t" '{image:$i, tag:$t, result:"DESTINATION_DIGEST_FAILED"}' >> receipt.jsonl
                  if registry_access_blocked; then break 2; fi
                  continue
                fi
                if [ "$sdig" = "$ndig" ]; then
                  jq -cn --arg i "$img" --arg t "$t" --arg d "$sdig" '{image:$i, tag:$t, digest:$d, result:"MIRRORED_VERIFIED"}' >> receipt.jsonl
                else
                  fail=1; jq -cn --arg i "$img" --arg t "$t" --arg s "$sdig" --arg d "$ndig" '{image:$i, tag:$t, source_digest:$s, dest_digest:$d, result:"DIGEST_MISMATCH"}' >> receipt.jsonl
                fi
              else
                cat "$crane_error" >&2
                fail=1; jq -cn --arg i "$img" --arg t "$t" '{image:$i, tag:$t, result:"COPY_FAILED"}' >> receipt.jsonl
                if registry_access_blocked; then break 2; fi
              fi
            done
          done
          echo "---- receipt ----"; cat receipt.jsonl
          jq -s '{ts:(now|todate), run:env.GITHUB_RUN_ID, source:env.SOURCE_ORG, dest:env.DEST_ORG, entries:., summary:(group_by(.result)|map({(.[0].result):length})|add)}' receipt.jsonl > mirror-receipt.json
          [ "$fail" -eq 0 ] || { echo "::error::one or more copies failed or did not verify"; exit 1; }

      - name: Finalize receipt for setup and preflight failures
        if: always()
        env:
          HARDEN_OUTCOME: ${{ steps.harden.outcome }}
          CREDS_STATE: ${{ steps.creds.outputs.state }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: |
          set -euo pipefail
          if [ -f mirror-receipt.json ] && jq -e '(.entries|type=="array") and (.summary|type=="object") and (.run|type=="string")' mirror-receipt.json >/dev/null; then
            exit 0
          fi
          if [ -f mirror-receipt.json ]; then
            result=MIRROR_RECEIPT_INVALID
          elif [ "$HARDEN_OUTCOME" != success ]; then
            result=HARDEN_RUNNER_FAILED
          elif [ "$CREDS_STATE" = SETUP_REQUIRED ]; then
            result=SETUP_REQUIRED
          elif [ "$CREDS_STATE" != READY ]; then
            result=CREDENTIAL_CHECK_FAILED
          elif [ "$INSTALL_OUTCOME" != success ]; then
            result=CRANE_INSTALL_FAILED
          elif [ "$AUTH_OUTCOME" != success ]; then
            result=REGISTRY_AUTH_FAILED
          elif [ "$MIRROR_OUTCOME" != success ]; then
            result=MIRROR_STEP_FAILED
          else
            result=MIRROR_RECEIPT_MISSING
          fi
          if [ ! -f receipt.jsonl ] || ! jq -s . receipt.jsonl >/dev/null 2>&1; then
            : > receipt.jsonl
          fi
          jq -cn --arg result "$result" '{result:$result}' >> receipt.jsonl
          jq -s '{ts:(now|todate), run:env.GITHUB_RUN_ID, source:env.SOURCE_ORG, dest:env.DEST_ORG, entries:., summary:(group_by(.result)|map({(.[0].result):length})|add)}' receipt.jsonl > mirror-receipt.json
          if [ "$result" = MIRROR_RECEIPT_INVALID ] || [ "$result" = MIRROR_RECEIPT_MISSING ]; then
            echo "::error::$result"; exit 1
          fi

      - name: Persist receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerhub-mirror-receipt-${{ github.run_id }}
          path: |
            mirror-receipt.json
            receipt.jsonl
          if-no-files-found: error
          retention-days: 90
